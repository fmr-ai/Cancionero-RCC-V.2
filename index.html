    <script id="portable-data">window.__INITIAL_SONGBOOK__={"songs":[{"id":"65155c58-59af-4496-b7f7-da9ab89ad998","title":"Cantad al Señor","key":"Do","categories":["Alabanza","Animación"],"mainCategories":[],"favorite":false,"eucaristica":false,"content":"C          G          Am         F\nCantad al Señor un cántico nuevo,\nC          G          F          C\ncantad al Señor, toda la tierra.\n\nAm         F          C          G\nBendecid su nombre, anunciad de día en día\nAm         F          G          C\nsu salvación, su maravilla."},{"id":"144aaa40-938a-481a-955a-2ecac74fe3e5","title":"Ven Espíritu Santo","key":"Re","categories":["Espíritu Santo","Efusión"],"mainCategories":["fav"],"favorite":true,"eucaristica":false,"content":"D          A          Bm         G\nVen, ven Espíritu de amor,\nD          A          D\nven a llenar nuestro corazón.\n\nG          D          Em         A\nVen, ven, no tardes más,\nD          A          D\nque te esperamos con ansiedad."},{"id":"4b53b1c2-4d65-419d-8865-2ea60bda138c","title":"Renuévame Señor Jesús","key":"Re","categories":["Sanación","Presencia"],"mainCategories":[],"favorite":false,"eucaristica":false,"content":"D          G          A          D\nRenuévame Señor Jesús,\nG          Em         A\nya no quiero ser igual.\n\nD          G          A          Bm\nRenuévame Señor Jesús,\nG          Em         A          D\npon en mí tu corazón."},{"id":"a23b9281-6d33-4334-b9cd-7932254ad2c2","title":"Juntos como hermanos","key":"Sol","categories":["Entrada"],"mainCategories":["eucaristia"],"favorite":false,"eucaristica":true,"content":"G          Em         C          D\nJuntos como hermanos, miembros de una Iglesia,\nG          D          G\nvamos caminando al encuentro del Señor.\n\nG          C          D          G\nUn largo caminar por el desierto bajo el sol,\nEm         Am         D          G\nno podemos avanzar sin la ayuda del Señor."},{"id":"8f5317b0-b3e8-4665-9557-57a91648236a","title":"Santo es el Señor","key":"Mi menor","categories":["Santo"],"mainCategories":["eucaristia"],"favorite":false,"eucaristica":true,"content":"Em         D          C          B7\nSanto, Santo, Santo es el Señor,\nEm         D          C          B7\nDios del universo.\n\nAm         D          G          Em\nLlenos están el cielo y la tierra de tu gloria,\nAm         B7         Em\nhosanna en el cielo."},{"id":"ea79d507-3be1-44db-815c-bada2bb60253","title":"Junto a ti María","key":"Re","categories":["María","Final"],"mainCategories":["eucaristia","fav"],"favorite":true,"eucaristica":true,"content":"D          A          Bm         F#m\nJunto a ti María, como un niño quiero estar,\nG          D          Em         A\ntómame en tus brazos, guíame en mi caminar.\n\nD          A          Bm         F#m\nQuiero que me eduques, que me enseñes a rezar,\nG          D          A          D\nhazme transparente, lléname de paz."}],"mainCategories":[{"id":"fav","name":"Favoritas","icon":"★","system":true,"subcategories":[]},{"id":"grupo","name":"Grupo de oración","icon":"🙏","system":true,"subcategories":["Animación","Alabanza","Adoración","Presencia","Sanación","Espíritu Santo","Gracia","Danza","Efusión","Cierre oración","Entrega"]},{"id":"eucaristia","name":"Eucaristía","icon":"✝️","system":true,"subcategories":["Entrada","Penitencial","Gloria","Aclamación","Aleluya","Ofertorio","Santo","Cordero","Comunión","Acción de gracias","Final","María"]},{"id":"piedrecitas","name":"Piedrecitas Blancas","icon":"🪨","system":true,"subcategories":["Amigo","Hermano","Mamá","Papá","Familia"]}],"categories":["Animación","Alabanza","Adoración","Presencia","Sanación","Espíritu Santo","Gracia","Danza","Efusión","Cierre oración","Entrega","Entrada","Penitencial","Gloria","Aclamación","Aleluya","Ofertorio","Santo","Cordero","Comunión","Acción de gracias","Final","María","Amigo","Hermano","Mamá","Papá","Familia"],"repertoires":[],"settings":{"theme":"light","fontSize":16,"logo":null,"sidebarCollapsed":false,"chordNotation":"ame
